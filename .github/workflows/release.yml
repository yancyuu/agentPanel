name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft=false 2>/dev/null \
            || echo "Release $TAG already exists, skipping creation"

  release-docker:
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

  # Build self-contained portable packages (bundle Node — no Node install for
  # end users) for each platform and attach them to the Release. The one-line
  # installers (install.sh / install.ps1 on the Pages site) download these.
  release-standalone:
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: agentcli-windows-x64.zip
          - runner: macos-15-intel
            asset: agentcli-macos-x64.zip
          - runner: macos-latest
            asset: agentcli-macos-arm64.zip
          - runner: ubuntu-latest
            asset: agentcli-linux-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:vendor
      - run: pnpm build:web
      - run: pnpm build:standalone
      - name: Zip portable folder
        shell: bash
        run: |
          cd dist-standalone
          if command -v zip >/dev/null 2>&1; then
            zip -r -q "../${{ matrix.asset }}" .
          elif command -v 7z >/dev/null 2>&1; then
            7z a -tzip "../${{ matrix.asset }}" .
          else
            echo "no zip/7z available on ${{ matrix.runner }}" >&2; exit 1
          fi
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" "${{ matrix.asset }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
